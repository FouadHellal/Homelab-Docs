[project]
name = "homelab-atlas"
version = "0.0.1"
description = "Read-only, agentless auto-discovery and documentation of a homelab."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Fouad HELLAL" }]
dependencies = [
    "asyncssh>=2.21",
    "httpx>=0.28",
    "pydantic>=2.10",
    "structlog>=25.1",
    "typer>=0.15",
]

[project.scripts]
atlas = "homelab_atlas.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.120",
    "mypy>=1.14",
    "poethepoet>=0.32",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=1.2",
    "pytest-cov>=6.0",
    "ruff>=0.17",
    "trustme>=1.2",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_atlas"]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------- tasks
[tool.poe.tasks]
fmt = { shell = "ruff format . && ruff check --fix .", help = "Format and autofix" }
lint = { shell = "ruff check . && ruff format --check .", help = "Lint and format check" }
type = { cmd = "mypy", help = "Type-check (strict)" }
test = { cmd = "pytest", help = "Run the test suite" }
secrets = { cmd = "pre-commit run gitleaks --all-files", help = "gitleaks over the working tree" }
audit = { shell = "uv export --quiet --frozen --format requirements-txt --no-emit-project -o .pip-audit-req.txt && uvx pip-audit --strict -r .pip-audit-req.txt", help = "pip-audit the locked deps" }
hooks = { cmd = "pre-commit run --all-files", help = "Run every pre-commit hook" }
check = { sequence = ["lint", "type", "test", "secrets"], help = "Everything CI gates on" }

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "PT", "PTH",
    "RUF", "TID", "ASYNC", "BLE", "T20", "PL", "TRY", "ERA",
]
ignore = ["TRY003", "PLR0913", "PLR0911", "PLR2004", "N818"]

[tool.ruff.lint.isort]
known-first-party = ["homelab_atlas", "tests"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# Outbound I/O is only allowed in homelab_atlas.security (ADR-003/008).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"httpx".msg = "Use homelab_atlas.security.http.ReadOnlyHttpClient"
"asyncssh".msg = "Use homelab_atlas.security.ssh.SshRunner"
"paramiko".msg = "Use homelab_atlas.security.ssh.SshRunner"
"requests".msg = "Use homelab_atlas.security.http.ReadOnlyHttpClient"
"urllib.request".msg = "Use homelab_atlas.security.http.ReadOnlyHttpClient"
"http.client".msg = "Use homelab_atlas.security.http.ReadOnlyHttpClient"
"socket".msg = "No raw sockets outside homelab_atlas.security"
"subprocess".msg = "No subprocesses: targets are reached only via SshRunner"
"os.system".msg = "No shell execution"
"os.popen".msg = "No shell execution"

[tool.ruff.lint.per-file-ignores]
"src/homelab_atlas/security/**" = ["TID251"]
"src/homelab_atlas/security/errors.py" = ["S105"]
"src/homelab_atlas/redact/rules.py" = ["S105"]
# RUF001: homoglyphs are deliberate attack inputs. S105/S106: fake ATLASFAKE secrets.
"tests/**" = ["S101", "TID251", "RUF001", "S105", "S106", "PT011"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = ["src", "."]
explicit_package_bases = true
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "security: refusal / bypass / redaction tests",
    "linux_only: needs a POSIX userland (probe gate tests)",
]

[tool.coverage.run]
source = ["homelab_atlas"]
branch = true
