name: image

# Build -> smoke test (hardened runtime) -> Trivy gate -> push to GHCR with SBOM + provenance.
# Pull requests build and scan only; pushes happen for main and v* tags.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/fouadhellal/homelab-docs
  # aquasec/trivy 0.76.0, digest resolved 2026-10-18 from registry-1.docker.io.
  TRIVY: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR (used only on non-PR events)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: build (local, for testing)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: atlas:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke test under the production hardening
        run: |
          set -euo pipefail
          hard=(--rm --read-only --cap-drop ALL --security-opt no-new-privileges:true
                --user 10001:10001 --tmpfs /tmp:size=16m,noexec,nosuid,nodev --network none)
          docker run "${hard[@]}" atlas:ci atlas --version
          docker run "${hard[@]}" atlas:ci atlas selftest security
          test "$(docker run --rm atlas:ci id -u)" = "10001"
          # Code must not be writable by the app user.
          if docker run --rm atlas:ci sh -c 'touch /opt/atlas/x' 2>/dev/null; then
            echo "::error::/opt/atlas is writable by the app user"; exit 1
          fi
          # UI starts (no hosts.yaml yet) and turns healthy; loopback exists without a network.
          docker run -d --name atlas-smoke --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --tmpfs /tmp:size=16m,noexec,nosuid,nodev \
            --network none -v atlas-smoke:/data atlas:ci
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' atlas-smoke 2>/dev/null || true)
            [ "$s" = healthy ] && break; sleep 2
          done
          docker logs atlas-smoke
          test "$(docker inspect -f '{{.State.Health.Status}}' atlas-smoke)" = healthy
          docker rm -f atlas-smoke

      - name: trivy (fail on fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro "$TRIVY" image \
            --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress atlas:ci

      - name: login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push (SBOM + max provenance attestations)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
