{% extends "base.html" %}
{% block title %}Changes{% endblock %}
{% block main %}
<h1>Changelog</h1>
<form class="filters" method="get" action="/changes" hx-get="/changes" hx-target="#rows" hx-trigger="input changed delay:300ms from:#q, change from:#severity" hx-push-url="true">
  <input id="q" name="q" value="{{ q }}" placeholder="Filter text or event type" maxlength="64" type="search">
  <select id="severity" name="severity">
    <option value="">All severities</option>
    {% for s in ["warning", "notice", "info"] %}<option value="{{ s }}"{% if s == severity %} selected{% endif %}>{{ s }}</option>{% endfor %}
  </select>
</form>
<table class="events timeline"><tbody id="rows">{% include "_change_rows.html" %}</tbody></table>
{% endblock %}
