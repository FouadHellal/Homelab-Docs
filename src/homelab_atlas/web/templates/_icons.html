{#- Line icons drawn for atlas (24px grid, stroke = currentColor). No icon font, no CDN,
    and nothing marked safe: every path is literal template markup. -#}
{% macro icon(name, cls="ic") -%}
<svg class="{{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == "dashboard" %}<rect x="3" y="3" width="7.5" height="9" rx="2"/><rect x="13.5" y="3" width="7.5" height="5" rx="2"/><rect x="13.5" y="11" width="7.5" height="10" rx="2"/><rect x="3" y="15" width="7.5" height="6" rx="2"/>
{%- elif name == "topology" %}<circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M12 7.5v4m0 0-5.2 5.4M12 11.5l5.2 5.4"/>
{%- elif name == "inventory" %}<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01M11 7.5h6M11 16.5h6"/>
{%- elif name == "services" %}<path d="M12 3 3 7.5l9 4.5 9-4.5L12 3Z"/><path d="m3 12 9 4.5 9-4.5M3 16.5 12 21l9-4.5"/>
{%- elif name == "apps" %}<path d="M21 7.5 12 3 3 7.5v9L12 21l9-4.5v-9Z"/><path d="m3 7.5 9 4.5 9-4.5M12 12v9"/>
{%- elif name == "ips" %}<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9S14.5 18.4 12 21M12 3C9.5 5.6 8.2 8.6 8.2 12s1.3 6.4 3.8 9"/>
{%- elif name == "vlans" %}<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="10" cy="18" r="1.6"/>
{%- elif name == "ports" %}<path d="M9 3v5M15 3v5M6.5 8h11v3.5a5.5 5.5 0 0 1-11 0V8ZM12 17v4"/>
{%- elif name == "unknown" %}<circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.7M12 17h.01"/>
{%- elif name == "changes" %}<path d="M3 12h4l3-7 4 14 3-7h4"/>
{%- elif name == "targets" %}<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/>
{%- elif name == "docs" %}<path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H19v16H7.5A2.5 2.5 0 0 0 5 20.5v-16Z"/><path d="M5 20.5A2.5 2.5 0 0 0 7.5 23H19v-5"/>
{%- elif name == "exports" %}<path d="M12 3v12m-5-5 5 5 5-5M4 21h16"/>
{%- elif name == "diagnostics" %}<path d="M3 12h3.5l2-4 3 8 2.5-6 1.5 2H21"/><rect x="2.5" y="3.5" width="19" height="17" rx="3"/>
{%- elif name == "search" %}<circle cx="11" cy="11" r="7"/><path d="m20 20-4.2-4.2"/>
{%- elif name == "menu" %}<path d="M4 6.5h16M4 12h16M4 17.5h16"/>
{%- elif name == "close" %}<path d="M6 6l12 12M18 6 6 18"/>
{%- elif name == "theme" %}<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 0 0 17Z" fill="currentColor"/>
{%- elif name == "logout" %}<path d="M15 4h3.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H15M10 16.5 14.5 12 10 7.5M14.5 12H3"/>
{%- elif name == "external" %}<path d="M14 4h6v6M20 4l-9 9M18 14v4.5A1.5 1.5 0 0 1 16.5 20h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/>
{%- elif name == "media" %}<rect x="2.5" y="5" width="19" height="13" rx="2.5"/><path d="m10 9 5 2.5-5 2.5V9ZM8 21h8"/>
{%- elif name == "integrations" %}<path d="M9 7V3M15 7V3M7 7h10v4a5 5 0 0 1-10 0V7ZM12 16v5"/><circle cx="12" cy="11" r="1"/>
{%- endif %}</svg>
{%- endmacro %}
