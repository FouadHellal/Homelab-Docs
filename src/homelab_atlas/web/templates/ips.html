{% extends "base.html" %}
{% block title %}IP addresses{% endblock %}
{% block main %}
<h1>IP addresses</h1>
<form class="filters" method="get" action="/ips" hx-get="/ips" hx-target="#rows" hx-trigger="input changed delay:300ms from:#q" hx-push-url="true">
  <input id="q" name="q" value="{{ q }}" placeholder="Filter by IP, MAC, name, VLAN" maxlength="64" type="search">
</form>
<table class="data"><thead><tr><th>IP</th><th>Name</th><th>MAC</th><th>Interface</th><th>Network</th><th>VLAN</th><th>Source</th></tr></thead>
<tbody id="rows">{% include "_ip_rows.html" %}</tbody></table>
{% endblock %}
