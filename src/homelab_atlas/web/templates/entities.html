{% extends "base.html" %}
{% block title %}Inventory{% endblock %}
{% block main %}
<h1>Inventory</h1>
<form class="filters" method="get" action="/entities" hx-get="/entities" hx-target="#rows" hx-trigger="input changed delay:300ms from:#q, change from:#kind" hx-push-url="true">
  <input id="q" name="q" value="{{ q }}" placeholder="Search name or key" maxlength="64" type="search">
  <select id="kind" name="kind">
    <option value="">All machines and devices</option>
    {% for k in kinds %}<option value="{{ k }}"{% if k == kind %} selected{% endif %}>{{ k }}</option>{% endfor %}
  </select>
</form>
<table class="data"><thead><tr><th>Name</th><th>Kind</th><th>Status</th><th>Same as</th><th>Last seen</th></tr></thead>
<tbody id="rows">{% include "_entity_rows.html" %}</tbody></table>
{% endblock %}
