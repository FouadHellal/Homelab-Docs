{% extends "base.html" %}
{% block title %}Ports{% endblock %}
{% block main %}
<h1>Ports and services</h1>
<form class="filters" method="get" action="/ports" hx-get="/ports" hx-target="#rows" hx-trigger="input changed delay:300ms from:#q" hx-push-url="true">
  <input id="q" name="q" value="{{ q }}" placeholder="Filter by port, host, process" maxlength="64" type="search">
</form>
<table class="data"><thead><tr><th>Port</th><th>Proto</th><th>Address</th><th>Host</th><th>What</th><th>Kind</th></tr></thead>
<tbody id="rows">{% include "_port_rows.html" %}</tbody></table>
{% endblock %}
