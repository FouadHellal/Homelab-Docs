# kubernetes-readonly.yaml -- generated by `atlas targets render` (ADR-048).
# kubectl apply -f kubernetes-readonly.yaml, then give atlas the token:
#   kubectl -n atlas get secret atlas-token -o jsonpath='{.data.token}' | base64 -d
# No Secrets, ConfigMaps, logs, exec, attach, port-forward or proxy; no write verb.
apiVersion: v1
kind: Namespace
metadata:
  name: atlas
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: atlas
  namespace: atlas
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: atlas-readonly
rules:
  - apiGroups: [""]
    resources: [namespaces, nodes, pods, services]
    verbs: [get, list]
  - apiGroups: ["apps"]
    resources: [daemonsets, deployments, statefulsets]
    verbs: [get, list]
  - nonResourceURLs: [/version]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: atlas-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: atlas-readonly
subjects:
  - kind: ServiceAccount
    name: atlas
    namespace: atlas
---
apiVersion: v1
kind: Secret
metadata:
  name: atlas-token
  namespace: atlas
  annotations:
    kubernetes.io/service-account.name: atlas
type: kubernetes.io/service-account-token
