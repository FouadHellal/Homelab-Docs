# atlas stack. The easy way to use it: deploy/atlas.sh install (see README "Deploy").
#
# Default = LAN mode: atlas serves HTTPS itself on port 8443 with a generated certificate
# (your browser warns once). Keep it on your LAN; never port-forward it to the internet.
# Behind your own TLS reverse proxy instead: docker-compose.proxy.yml (docs/DEPLOY.md).
#
# Files next to this one (created by deploy/atlas.sh):
#   .env                      settings below (never commit it)
#   secrets/atlas_master_key  encrypts the passwords / API keys you type in the UI (uid 10001, 0400)
#   config/                   optional hosts.yaml + CA files; config/annotations/ (notes from the UI)
#
# .env:
#   ATLAS_HOSTS     names/IPs you will open atlas with, comma-separated (e.g. 192.168.1.50,atlas.lan)
#   ATLAS_PORT      published port (default 8443)
#   ATLAS_BIND      host address to publish on (default 0.0.0.0 = every interface of this VM)
#   ATLAS_VERSION   image tag (default latest)
#   ATLAS_INTERVAL_<COLLECTOR>, ATLAS_SNAPSHOT_DAYS (optional tuning)

name: atlas

x-hardening: &hardening
  image: ${ATLAS_IMAGE:-ghcr.io/fouadhellal/homelab-docs}:${ATLAS_VERSION:-latest}
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=64m,mode=1777,noexec,nosuid,nodev"]
  pids_limit: 256
  mem_limit: 768m
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  atlas:
    <<: *hardening
    build: .   # used by `deploy/atlas.sh install --build` when the image can't be pulled
    command:
      - atlas
      - serve
      - --host=0.0.0.0
      - --port=8443
      - --self-signed-tls
      - --schedule
      - --allowed-host=${ATLAS_HOSTS:-localhost}
    ports:
      - "${ATLAS_BIND:-0.0.0.0}:${ATLAS_PORT:-8443}:8443"
    environment:
      ATLAS_SNAPSHOT_DAYS: ${ATLAS_SNAPSHOT_DAYS:-90}
      ATLAS_INTERVAL_UNIFI: ${ATLAS_INTERVAL_UNIFI:-900}
      ATLAS_INTERVAL_PROXMOX: ${ATLAS_INTERVAL_PROXMOX:-900}
      ATLAS_INTERVAL_LINUX_SSH: ${ATLAS_INTERVAL_LINUX_SSH:-3600}
      ATLAS_INTERVAL_DOCKER: ${ATLAS_INTERVAL_DOCKER:-3600}
      ATLAS_INTERVAL_PI: ${ATLAS_INTERVAL_PI:-3600}
      ATLAS_INTERVAL_NAS: ${ATLAS_INTERVAL_NAS:-21600}
    volumes:
      - atlas-data:/data
      - ./config:/config:ro
      - ./config/annotations:/config/annotations   # the UI's annotation editor writes here
    secrets: [atlas_master_key]

  # Optional read-only MCP endpoint for AI assistants: `docker compose --profile mcp up -d`.
  mcp:
    <<: *hardening
    profiles: [mcp]
    command:
      - atlas
      - mcp
      - --http
      - --host=0.0.0.0
      - --port=8765
      - --allowed-host=${ATLAS_MCP_HOST:-127.0.0.1:8765}
    ports:
      - "${ATLAS_MCP_BIND:-127.0.0.1}:8765:8765"
    volumes:
      - atlas-data:/data
    secrets: [mcp_token]
    depends_on:
      atlas: { condition: service_healthy }   # atlas runs the DB migrations first
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8765), 3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  atlas-data:

secrets:
  atlas_master_key: { file: ./secrets/atlas_master_key }
  mcp_token: { file: ./secrets/mcp_token }
  # hosts.yaml users add their secret files here, e.g.:
  # proxmox_auditor: { file: ./secrets/proxmox_auditor }
